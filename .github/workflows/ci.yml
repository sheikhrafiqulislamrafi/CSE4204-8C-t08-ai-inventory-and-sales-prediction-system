name: CI — myShop AI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend ──────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python / FastAPI)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint with ruff (non-blocking)
        working-directory: backend
        run: pip install ruff && ruff check . --ignore E501 || true

      - name: Check imports resolve
        working-directory: backend
        run: |
          python -c "
          import sys, os
          os.chdir('.')
          # Quick smoke test — imports only
          import database, models, auth, ai_service, sheets_service, email_service
          print('All backend modules imported successfully')
          "
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: ci-test-secret
          REPORT_HOUR: "8"
          REPORT_MINUTE: "0"

  # ─── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (React / Vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint || true

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: /api

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ─── Docker build check ───────────────────────────────────────────────────
  docker:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build
        env:
          SECRET_KEY: ci-test-secret
          VITE_API_URL: /api
